
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>yojimboyd | photos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    
	<style>
        * {
            box-sizing: border-box;
        }

        body {
			max-width: 1200px;
            margin: 0 auto;
			padding-top: 100px;
            padding: 100px;
            font-family: Arial, sans-serif;
			background-color: #F1F1F1;
		}

        h1 {
	    font-size: 15px;
            font-family: "Bitcount Single", serif;
            font-weight: 400;
            margin: 0 0 30px;
			margin-bottom: 50px;
			text-align: center;
			color: #464646;
			font-size: clamp(1rem, 4vw, 2rem); 
			letter-spacing: 1em
			
        }

        .gallery {
            display: grid;
            gap: 5em;
            margin-bottom: 5em;
        }

        .three {
            grid-template-columns: repeat(3, 1fr);
        }

        .two {
            grid-template-columns: repeat(2, 1fr);
        }

        img {
            display: block;
            width: 100%;
            height: auto;
			border-radius: 5px;
			cursor: pointer;
        }

        .email {
			font-family: "Bitcount Single", serif;
			font-style: Italic;
            display: block;
            margin-top: 35px;
            color: inherit;
            text-decoration: none;
            font-size: 14px;
			text-align: center;
			color: #464646;
        }
		
		.lightbox {
			display: none;
			position: fixed;
			z-index: 1000;
			inset: 0;
			background: rgba(245, 243, 238, 0.65);
			justify-content: center;
			align-items: center;
			padding: 40px;
			backdrop-filter: blur(15px) brightness(1.15);
			-webkit-backdrop-filter: blur(15px) brightness(1.15);
		}

		/* Enlarged photograph */
		.lightbox img {
			max-width: 90%;
			max-height: 85vh;
			width: auto;
			height: auto;
			object-fit: contain;
			border-radius: 4px;
			cursor: default;
		}

		/* Close button */
		.lightbox .close {
			position: absolute;
			top: 25px;
			right: 35px;
			color: #464646;
			font-size: 35px;
			font-family: Arial, sans-serif;
			font-weight: 200;
			cursor: pointer;
			background: none;
			border: none;
		}

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .gallery {
                gap: 6px;
                margin-bottom: 6px;
            }
			
        }
		
		
    </style>
</head>

<h1>yojimboyd</h1>

<body>

    <!-- Three portraits -->
    <div class="gallery three">
        <img src="images/harry1.jpg" alt="">
        <img src="images/keir4bw.jpg" alt="">
        <img src="images/steelGitTweak.jpg" alt="">
    </div>

    <!-- Two landscapes -->
    <div class="gallery two">
        <img src="images/room4.jpg" alt="">
        <img src="images/dannyDrums2.jpg" alt="">
    </div>

    <!-- Three more portraits -->
    <div class="gallery three">
        <img src="images/danny1.jpg" alt="">
        <img src="images/harry5.jpg" alt="">
        <img src="images/dannyDrums.jpg" alt="">
    </div>
	
	<div class="lightbox" id="lightbox">

    <button class="close" id="close">&times;</button>

    <img id="lightbox-image" src="" alt="">

	</div>

    <!-- Email -->
    <a class="email" href="mailto:yojimboyd@gmail.com">
        yojimboyd@gmail.com
    </a>
	
	<script>

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeButton = document.getElementById('close');

    // Open photograph
    document.querySelectorAll('.gallery img').forEach(image => {

        image.addEventListener('click', () => {
            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            lightbox.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });

    });

    // Close photograph
    function closeLightbox() {
        lightbox.style.display = 'none';
        lightboxImage.src = '';
        document.body.style.overflow = '';
    }

    closeButton.addEventListener('click', closeLightbox);

    // Close when clicking outside photograph
    lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
            closeLightbox();
        }
    });

    // Close with Escape key
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            closeLightbox();
        }
    });

	</script>

</body>

</html>
